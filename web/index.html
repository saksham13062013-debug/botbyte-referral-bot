<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>BotByte Refer & Earn</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root{--bg:var(--tg-theme-bg-color,#fff);--text:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#777);--card:var(--tg-theme-secondary-bg-color,#f4f4f5);--accent:var(--tg-theme-button-color,#7c3aed)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
    .wrap{max-width:520px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    h1{font-size:22px;margin:0}.sub{color:var(--hint);font-size:13px;margin-top:4px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border-radius:18px;padding:16px}
    .wide{grid-column:1/-1}.label{font-size:13px;color:var(--hint)}.value{font-size:25px;font-weight:700;margin-top:7px}
    button,input,select{width:100%;border:0;border-radius:13px;padding:13px;font-size:15px}
    button{background:var(--accent);color:#fff;font-weight:700;margin-top:9px}input,select{background:var(--bg);color:var(--text);outline:1px solid #ddd;margin-top:7px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.msg{min-height:20px;color:var(--hint);font-size:13px;margin-top:8px}
    .tx{padding:9px 0;border-bottom:1px solid #ddd;font-size:13px;display:flex;justify-content:space-between}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>💰 BotByte</h1><div class="sub" id="name">Loading...</div></div><div>🎁</div></div>
  <div class="grid">
    <div class="card"><div class="label">Balance</div><div class="value">₹<span id="balance">0</span></div></div>
    <div class="card"><div class="label">Referrals</div><div class="value" id="refs">0</div></div>
    <div class="card wide"><div class="label">Total Earned</div><div class="value">₹<span id="earned">0</span></div></div>
    <div class="card wide">
      <b>💕 Refer & Earn</b><p class="sub">Earn ₹<span id="reward">3</span> per successful referral.</p>
      <input id="ref" readonly><button id="share">📤 Share Referral Link</button>
    </div>
    <div class="card wide">
      <b>🏦 Payout Method</b>
      <select id="method"><option value="UPI">UPI</option><option value="Bank">Bank</option></select>
      <input id="payout" placeholder="UPI ID / payout details">
      <button id="savePayout">Save Payout Method</button><div class="msg" id="pmsg"></div>
    </div>
    <div class="card wide">
      <b>🚀 Withdraw</b><div class="sub">Minimum ₹<span id="min">20</span></div>
      <input id="amount" type="number" min="20" step="1" placeholder="Amount">
      <button id="withdraw">Request Withdrawal</button><div class="msg" id="wmsg"></div>
    </div>
    <div class="card wide">
      <b>🎉 Gift Code</b>
      <input id="code" placeholder="Enter gift code">
      <button id="redeem">Redeem Code</button><div class="msg" id="gmsg"></div>
    </div>
    <div class="card wide"><b>📜 Recent Activity</b><div id="tx"></div></div>
  </div>
</div>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const headers=()=>({'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''});
async function load(){
  const r=await fetch('/api/me',{headers:headers()}); const d=await r.json();
  if(!r.ok){document.getElementById('name').textContent=d.detail||'Open inside Telegram';return;}
  name.textContent=d.user.first_name+(d.user.username?' @'+d.user.username:'');
  balance.textContent=Number(d.balance).toFixed(2); earned.textContent=Number(d.total_earned).toFixed(2); refs.textContent=d.referrals;
  reward.textContent=d.reward; min.textContent=d.min_withdrawal; ref.value=d.referral_link;
  method.value=d.payout_method||'UPI'; payout.value=d.payout_value||'';
  tx.innerHTML=d.transactions.map(x=>`<div class="tx"><span>${x.type}</span><b>${x.amount>=0?'+':''}₹${Number(x.amount).toFixed(2)}</b></div>`).join('');
}
share.addEventListener('click',()=>{const u=encodeURIComponent(ref.value);tg?.openTelegramLink(`https://t.me/share/url?url=${u}&text=${encodeURIComponent('Join BotByte and start earning!')}`)});
savePayout.addEventListener('click',async()=>{const r=await fetch('/api/payout',{method:'POST',headers:headers(),body:JSON.stringify({method:method.value,value:payout.value})});pmsg.textContent=r.ok?'✅ Saved':'❌ '+(await r.json()).detail});
withdraw.addEventListener('click',async()=>{const r=await fetch('/api/withdraw',{method:'POST',headers:headers(),body:JSON.stringify({amount:amount.value})});wmsg.textContent=r.ok?'✅ Withdrawal request submitted':'❌ '+(await r.json()).detail;if(r.ok)load()});
redeem.addEventListener('click',async()=>{const r=await fetch('/api/gift',{method:'POST',headers:headers(),body:JSON.stringify({code:code.value})});gmsg.textContent=r.ok?'🎉 Gift code redeemed!':'❌ '+(await r.json()).detail;if(r.ok){code.value='';load()}});
load();
</script>
</body>
</html>
