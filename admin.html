<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BotByte Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--blue:#2563eb;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--danger:#dc2626;--ok:#16a34a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.top h1{margin:0;font-size:24px}.badge{background:#e8f0ff;color:var(--blue);padding:7px 11px;border-radius:999px;font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.label{color:var(--muted);font-size:13px}.num{font-size:25px;font-weight:800;margin-top:6px}.section{margin-top:16px}.section h2{font-size:18px;margin:0 0 10px}.row{display:flex;gap:10px;flex-wrap:wrap}.input,select,button{font:inherit;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}.input{flex:1;min-width:130px}button{background:var(--blue);color:#fff;border:0;font-weight:700;cursor:pointer}.danger{background:var(--danger)}.ok{background:var(--ok)}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:14px}.muted{color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap}.notice{padding:14px;border-radius:14px;background:#fff7ed;color:#9a3412;margin-bottom:14px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.table{display:block;overflow:auto;white-space:nowrap}}
</style></head><body><main class="wrap">
<div class="top"><h1>🛠 BotByte Admin</h1><span class="badge">ADMIN</span></div><div id="notice"></div>
<div class="grid"><div class="card"><div class="label">Users</div><div id="users" class="num">—</div></div><div class="card"><div class="label">Total Balance</div><div id="balance" class="num">—</div></div><div class="card"><div class="label">Total Earned</div><div id="earned" class="num">—</div></div><div class="card"><div class="label">Withdrawn</div><div id="withdrawn" class="num">—</div></div></div>
<section class="section card"><h2>💸 Pending Withdrawals</h2><div id="withdrawals" class="muted">Loading…</div></section>
<section class="section card"><h2>🎁 Create Gift Code</h2><div class="row"><input id="gcode" class="input" placeholder="CODE"><input id="gamount" class="input" type="number" step="0.01" placeholder="Amount ₹"><input id="guses" class="input" type="number" value="1" min="1" placeholder="Max uses"><button id="createGift">Create</button></div><p id="giftMsg" class="muted"></p></section>
<section class="section card"><h2>📢 Broadcast</h2><p class="muted">Send a message to every user registered with the bot.</p><textarea id="broadcastText" class="input" style="width:100%;min-height:130px;resize:vertical" maxlength="4096" placeholder="Type your broadcast message…"></textarea><div class="row" style="margin-top:10px"><button id="sendBroadcast">📢 Send Broadcast</button></div><p id="broadcastMsg" class="muted" aria-live="polite"></p></section>
<section class="section card"><h2>💰 Add Balance</h2><div class="row"><input id="uid" class="input" type="number" placeholder="Telegram User ID"><input id="uamount" class="input" type="number" step="0.01" placeholder="Amount ₹"><button id="addBalance">Add Balance</button></div><p id="balMsg" class="muted"></p></section>
<section class="section card"><h2>👥 Users</h2><div id="userlist" class="muted">Loading…</div></section>
</main><script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const headers={'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''};
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Request failed');return d}
function money(x){return '₹'+Number(x||0).toFixed(2)}
async function load(){try{const d=await api('/api/admin/overview'); users.textContent=d.users;balance.textContent=money(d.balance);earned.textContent=money(d.earned);withdrawn.textContent=money(d.withdrawn); renderW(d.withdrawals); renderU(d.user_list)}catch(e){notice.innerHTML='<div class="notice">❌ '+e.message+'</div>'}}
function renderW(rows){if(!rows.length){withdrawals.innerHTML='<p class="muted">No pending withdrawals.</p>';return}withdrawals.innerHTML='<table class="table"><tr><th>#</th><th>User</th><th>Amount</th><th>Payout</th><th>Action</th></tr>'+rows.map(r=>`<tr><td>${r.id}</td><td>${r.user}</td><td>${money(r.amount)}</td><td>${r.method}: ${r.value}</td><td><div class="actions"><button class="ok" data-a="approve" data-id="${r.id}">Approve</button><button class="danger" data-a="reject" data-id="${r.id}">Reject</button></div></td></tr>`).join('')+'</table>'}
function renderU(rows){userlist.innerHTML='<table class="table"><tr><th>User</th><th>Referrals</th><th>Balance</th><th>Earned</th></tr>'+rows.map(r=>`<tr><td>${r.user} <span class="muted">(${r.id})</span></td><td>${r.referrals}</td><td>${money(r.balance)}</td><td>${money(r.earned)}</td></tr>`).join('')+'</table>'}
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-a]');if(!b)return;try{await api('/api/admin/withdrawal',{method:'POST',body:JSON.stringify({id:Number(b.dataset.id),action:b.dataset.a})});load()}catch(x){alert(x.message)}});
createGift.onclick=async()=>{try{const d=await api('/api/admin/gift',{method:'POST',body:JSON.stringify({code:gcode.value,amount:Number(gamount.value),max_uses:Number(guses.value)})});giftMsg.textContent='✅ Created '+d.code+' for '+money(d.amount);gcode.value='';gamount.value='';load()}catch(e){giftMsg.textContent='❌ '+e.message}};
addBalance.onclick=async()=>{try{const d=await api('/api/admin/balance',{method:'POST',body:JSON.stringify({user_id:Number(uid.value),amount:Number(uamount.value)})});balMsg.textContent='✅ Added '+money(d.amount);uamount.value='';load()}catch(e){balMsg.textContent='❌ '+e.message}};
sendBroadcast.onclick=async()=>{const text=broadcastText.value.trim();if(!text){broadcastMsg.textContent='❌ Enter a message first.';return}if(!confirm('Send this message to all registered users?'))return;sendBroadcast.disabled=true;broadcastMsg.textContent='Sending…';try{const d=await api('/api/admin/broadcast',{method:'POST',body:JSON.stringify({text})});broadcastMsg.textContent='✅ Broadcast complete: '+d.sent+' sent, '+d.failed+' failed, '+d.total+' total.';broadcastText.value='';}catch(e){broadcastMsg.textContent='❌ '+e.message}finally{sendBroadcast.disabled=false}};
load();setInterval(load,15000);
</script></body></html>
